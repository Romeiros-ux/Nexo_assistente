# ═══════════════════════════════════════════════════════════════════
# 🚀 RENDER.COM - BLUEPRINT DE DEPLOY
# ═══════════════════════════════════════════════════════════════════
# 
# Este arquivo configura o deploy automático do backend no Render.com
# 
# IMPORTANTE: Este arquivo NÃO contém valores sensíveis (secrets).
# Os secrets devem ser configurados manualmente no Render Dashboard.
#
# ═══════════════════════════════════════════════════════════════════

services:
  # ─────────────────────────────────────────────────────────────────
  # BACKEND - API Node.js + TypeScript
  # ─────────────────────────────────────────────────────────────────
  - type: web
    name: nexo-assistente-backend
    runtime: node
    region: oregon  # Região mais próxima (use 'oregon' ou 'singapore')
    plan: free      # Plano gratuito (750h/mês) - Mudar para 'starter' ($7/mês) em produção
    branch: main    # Branch do GitHub que será deployado
    
    # Diretório raiz do backend
    rootDir: backend
    
    # ─────────────────────────────────────────────────────────────────
    # COMANDOS DE BUILD E START
    # ─────────────────────────────────────────────────────────────────
    
    # Instala dependências e compila TypeScript → JavaScript
    buildCommand: npm install && npm run build
    
    # Inicia o servidor em produção
    startCommand: npm start
    
    # ─────────────────────────────────────────────────────────────────
    # HEALTH CHECK - Render verifica se o serviço está funcionando
    # ─────────────────────────────────────────────────────────────────
    healthCheckPath: /health
    
    # ─────────────────────────────────────────────────────────────────
    # VARIÁVEIS DE AMBIENTE
    # ─────────────────────────────────────────────────────────────────
    
    envVars:
      # ═════════════════════════════════════════════════════════════
      # SERVIDOR
      # ═════════════════════════════════════════════════════════════
      - key: NODE_ENV
        value: production
      
      - key: PORT
        value: 10000  # Render usa porta 10000 por padrão
      
      - key: API_PREFIX
        value: /api/v1
      
      # ═════════════════════════════════════════════════════════════
      # CORS - URL do frontend (atualizar após deploy do frontend)
      # ═════════════════════════════════════════════════════════════
      - key: ALLOWED_ORIGINS
        value: https://nexo-assistente.vercel.app,https://nexo-assistente.netlify.app
        # ⚠️ ATUALIZAR após deploy do frontend com a URL real
      
      # ═════════════════════════════════════════════════════════════
      # JWT
      # ═════════════════════════════════════════════════════════════
      - key: JWT_EXPIRES_IN
        value: 7d
      
      # ═════════════════════════════════════════════════════════════
      # OPENAI - Configurações de Embedding e Chat
      # ═════════════════════════════════════════════════════════════
      - key: OPENAI_MODEL
        value: text-embedding-3-large
      
      - key: OPENAI_DIMENSIONS
        value: 1536
      
      - key: OPENAI_MAX_TOKENS
        value: 8191
      
      - key: OPENAI_BATCH_SIZE
        value: 50
      
      # ═════════════════════════════════════════════════════════════
      # LOGS
      # ═════════════════════════════════════════════════════════════
      - key: LOG_LEVEL
        value: info
      
      # ═════════════════════════════════════════════════════════════
      # ⚠️ SECRETS - CONFIGURAR MANUALMENTE NO RENDER DASHBOARD
      # ═════════════════════════════════════════════════════════════
      # Os valores abaixo são placeholders.
      # Você DEVE configurar os valores reais no Render Dashboard:
      # 1. Acesse o serviço no Render
      # 2. Vá em "Environment"
      # 3. Adicione cada secret manualmente
      # ═════════════════════════════════════════════════════════════
      
      # SUPABASE (obter do Supabase Dashboard → Settings → API)
      - key: SUPABASE_URL
        sync: false  # Não sincronizado do Git (configurar manualmente)
      
      - key: SUPABASE_ANON_KEY
        sync: false
      
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      
      - key: DATABASE_PASSWORD
        sync: false
      
      # OPENAI (obter de platform.openai.com → API Keys)
      - key: OPENAI_API_KEY
        sync: false
      
      # JWT (gerar novo: https://generate-secret.vercel.app/64)
      - key: JWT_SECRET
        sync: false
      
      # ═════════════════════════════════════════════════════════════
      # REDIS (OPCIONAL - para background jobs)
      # ═════════════════════════════════════════════════════════════
      # Pode deixar em branco inicialmente. Sistema funciona sem Redis.
      # Para adicionar Redis: use Upstash (upstash.com) - free tier disponível
      # ═════════════════════════════════════════════════════════════
      - key: REDIS_URL
        sync: false
        # Formato: rediss://default:password@host:6380
        # Deixe vazio se não for usar Redis inicialmente

# ═══════════════════════════════════════════════════════════════════
# 📝 PRÓXIMOS PASSOS APÓS CRIAR ESTE ARQUIVO
# ═══════════════════════════════════════════════════════════════════
#
# 1. Commit e push este arquivo para o GitHub:
#    git add render.yaml
#    git commit -m "feat: adicionar configuração de deploy Render"
#    git push origin main
#
# 2. Acesse render.com e crie uma conta
#
# 3. Conecte seu repositório GitHub
#
# 4. Render detectará automaticamente este arquivo render.yaml
#
# 5. Configure os secrets manualmente no Render Dashboard
#
# 6. Aguarde o primeiro deploy (3-5 minutos)
#
# 7. Teste o endpoint: https://nexo-assistente-backend.onrender.com/health
#
# ═══════════════════════════════════════════════════════════════════
