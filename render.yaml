services:
  - type: web
    name: nexo-assistente
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run preview -- --port $PORT --host 0.0.0.0
    envVars:
      - key: NODE_VERSION
        value: 18.19.0
      - key: VITE_SUPABASE_URL
        value: https://bkssobleshobcwnnipak.supabase.co
      - key: VITE_SUPABASE_PROJECT_ID
        value: bkssobleshobcwnnipak
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false  # Você deve adicionar isso manualmente no painel do Render
    healthCheckPath: /
